<!doctype html>
<html>
  <head>
    <title>LTPA Documentation</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        padding: 40px;
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .versions {
        list-style: none;
      }
      .versions li {
        margin-bottom: 12px;
      }
      .versions a {
        display: block;
        padding: 12px 16px;
        background: #f5f5f5;
        border-left: 4px solid #667eea;
        color: #333;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.2s ease;
      }
      .versions a:hover {
        background: #efefef;
        border-left-color: #764ba2;
        transform: translateX(4px);
      }
      .version-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 12px;
        vertical-align: middle;
      }
      .latest-badge {
        background: #4caf50;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>LTPA Documentation</h1>
      <p class="subtitle">Select a version to view documentation</p>
      <ul class="versions" id="versionsList"></ul>
    </div>

    <script>
      fetch('.')
        .then((response) => response.text())
        .then((html) => {
          const parser = new DOMParser()
          const doc = parser.parseFromString(html, 'text/html')
          const links = Array.from(doc.querySelectorAll('a'))
            .map((a) => a.getAttribute('href'))
            .filter((href) => href && /^\d+\.\d+\.\d+\/$/.test(href))
            .map((href) => href.replace(/\/$/, ''))
            .sort((a, b) => {
              return b.localeCompare(a, undefined, { numeric: true })
            })

          const versionsList = document.getElementById('versionsList')
          const latestVersion = links[0]

          if (links.length === 0) {
            versionsList.innerHTML =
              '<li style="color: #999;">No documentation versions available</li>'
            return
          }

          links.forEach((version) => {
            const li = document.createElement('li')
            const a = document.createElement('a')
            a.href = `./${version}/`
            a.textContent = version

            if (version === latestVersion) {
              const badge = document.createElement('span')
              badge.className = 'version-badge latest-badge'
              badge.textContent = 'Latest'
              a.appendChild(badge)
            }

            li.appendChild(a)
            versionsList.appendChild(li)
          })
        })
        .catch((error) => {
          console.error('Error loading versions:', error)
          document.getElementById('versionsList').innerHTML =
            '<li style="color: red;">Error loading versions</li>'
        })
    </script>
  </body>
</html>
